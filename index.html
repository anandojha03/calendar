<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2026 Interview & Habit Calendar</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="styles.css" />
</head>
<body>

<nav class="navbar navbar-dark bg-primary px-3">
    <button class="btn btn-light btn-sm" id="prevMonth">
        <i class="bi bi-chevron-left"></i>
    </button>

    <span class="navbar-brand mx-auto" id="monthTitle"></span>

    <button class="btn btn-light btn-sm" id="nextMonth">
        <i class="bi bi-chevron-right"></i>
    </button>
</nav>

<div class="container-fluid my-3" id="calendar"></div>

<div class="d-flex justify-content-center mb-3" id="month-dots"></div>

<!-- Move Task Modal -->
<div class="modal fade" id="moveModal" tabindex="-1">
    <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Move Task</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="date" class="form-control" id="moveDate">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary btn-sm" id="confirmMove">Move</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
